services:
  nullvoid-engine:
    build:
      context: ./services/null-void-service
      network: host
    container_name: nullvoid-engine
    network_mode: "host"
    volumes:
      - ${DATA_HOST_DIR:-./data/app}:/app/data
      - ${SCRAPER_HOST_DIR:-./data/scraper}:/app/scraper_data
      - ./services/null-void-service/src:/app/src
      - ./apps/client_agent:/app/client_agent
      - ${SECRETS_HOST_DIR:-./.secrets}:/app/.secrets:ro
      - ${CERTS_HOST_DIR:-./certs}:/app/certs:ro
      # Socket de Docker para que la app arranque/pare el contenedor de
      # Ollama bajo demanda (arranque perezoso / apagado por inactividad).
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /sys/class/thermal:/sys/class/thermal:ro
      - /sys/class/hwmon:/sys/class/hwmon:ro
      - /sys/devices:/sys/devices:ro
      - /sys:/host_sys:ro
    env_file:
      - .env
    environment:
      - DEBUG=${DEBUG:-false}
      - FLASK_PORT=5000
      - HOST=0.0.0.0
      - OLLAMA_HOST=http://127.0.0.1:11434
      - GUNICORN_VERSION=true
      - DATA_DIR=/app/data
      - SCRAPER_DIR=/app/scraper_data
      # Caché de vídeo transcodificado (LRU): límite máximo y calidad que se
      # genera automáticamente al abrir un vídeo (el resto, bajo demanda).
      - VIDEO_CACHE_MAX_MB=5120
      - VIDEO_PREWARM_QUALITY=720p
      - VIDEO_TRANSCODE_TIMEOUT=900
    command: >
      /bin/sh -c "
      if [ \"$$USE_HTTPS\" = 'true' ] && [ -f /app/certs/key.pem ] && [ -f /app/certs/cert.pem ]; then
        gunicorn --worker-class geventwebsocket.gunicorn.workers.GeventWebSocketWorker --bind 0.0.0.0:5000 --workers 1 --keyfile /app/certs/key.pem --certfile /app/certs/cert.pem --chdir src app:app;
      else
        if [ \"$$USE_HTTPS\" = 'true' ]; then
          echo 'AVISO: USE_HTTPS=true pero faltan /app/certs/key.pem o /app/certs/cert.pem. Arrancando sin TLS.';
        fi;
        gunicorn --worker-class geventwebsocket.gunicorn.workers.GeventWebSocketWorker --bind 0.0.0.0:5000 --workers 1 --chdir src app:app;
      fi"
    security_opt:
      - no-new-privileges:true  
    cap_drop:
      - ALL 
    cap_add:
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
    read_only: false            
    tmpfs:
      - /tmp                    
    restart: unless-stopped
    depends_on:
      - ollama

  nullvoid-scraper:
    build:
      context: ./services/scraper_service
      network: host
    profiles: ["scraper"]
    network_mode: "host"
    container_name: nullvoid-scraper
    volumes:
      - ${SCRAPER_HOST_DIR:-./data/scraper}:/app/scraper_data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      - SCRAPER_DIR=/app/scraper_data
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama-data:/root/.ollama
    security_opt:
      - no-new-privileges:true
    # Sin auto-reinicio: la app lo arranca bajo demanda y lo apaga por
    # inactividad (watcher de servicios de IA).
    restart: "no"
    network_mode: "host"



volumes:
  ollama-data: