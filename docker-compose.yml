services:
  nullvoid-engine:
    build: ./null-void-service
    container_name: nullvoid-engine
    network_mode: "host"
    volumes:
      - ${DATA_HOST_DIR:-./data}:/app/data
      - ${SCRAPER_HOST_DIR:-./data}:/app/data/scraper
      - ./null-void-service/src:/app/src
      - ./client_agent:/app/client_agent
      - ./.secrets:/app/src/.secrets:ro
      - ${CERTS_HOST_DIR:-./certs}:/app/certs:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /sys/class/thermal:/sys/class/thermal:ro
      - /sys/class/hwmon:/sys/class/hwmon:ro
      - /sys/devices:/sys/devices:ro
      - /sys:/host_sys:ro
    env_file:
      - .env
    environment:
      - DEBUG=true
      - FLASK_PORT=5000
      - HOST=0.0.0.0
      - OLLAMA_HOST=http://127.0.0.1:11434
      - GUNICORN_VERSION=true
      # Caché de vídeo transcodificado (LRU): límite máximo y calidad que se
      # genera automáticamente al abrir un vídeo (el resto, bajo demanda).
      - VIDEO_CACHE_MAX_MB=5120
      - VIDEO_PREWARM_QUALITY=720p
      - VIDEO_TRANSCODE_TIMEOUT=900
    command: >
      /bin/sh -c "
      if [ \"$$USE_HTTPS\" = 'true' ] && [ -f /app/certs/key.pem ] && [ -f /app/certs/cert.pem ]; then
        gunicorn --worker-class geventwebsocket.gunicorn.workers.GeventWebSocketWorker --bind 0.0.0.0:5000 --workers 1 --reload --keyfile /app/certs/key.pem --certfile /app/certs/cert.pem --chdir src app:app;
      else
        if [ \"$$USE_HTTPS\" = 'true' ]; then
          echo 'AVISO: USE_HTTPS=true pero faltan /app/certs/key.pem o /app/certs/cert.pem. Arrancando sin TLS.';
        fi;
        gunicorn --worker-class geventwebsocket.gunicorn.workers.GeventWebSocketWorker --bind 0.0.0.0:5000 --workers 1 --reload --chdir src app:app;
      fi"
    security_opt:
      - no-new-privileges:true  
    cap_drop:
      - ALL 
    cap_add:
      - NET_BIND_SERVICE                    
    read_only: false            
    tmpfs:
      - /tmp                    
    restart: unless-stopped
    depends_on:
      - ollama

  nullvoid-scraper:
    build:
      context: ./scraper_service
    profiles: ["scraper"]
    network_mode: "host"
    container_name: nullvoid-scraper
    volumes:
      - ${DATA_HOST_DIR:-./data}:/app/data
      - ${SCRAPER_HOST_DIR:-./data}:/app/data/scraper
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama-data:/root/.ollama
    security_opt:
      - no-new-privileges:true

    restart: unless-stopped
    network_mode: "host"



volumes:
  ollama-data:
