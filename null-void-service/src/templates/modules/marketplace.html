<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Null-Void Engine</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}" />
    <script>
        (function () {
            let __theme = localStorage.getItem('theme');
            if (!__theme) { __theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }
            document.documentElement.setAttribute('data-theme', __theme);
        })();
    </script>
    <style>
        :root,
        [data-theme="dark"] {
            --bg: #0f172a;
            --surface: rgba(30, 41, 59, 0.7);
            --surface-hi: rgba(51, 65, 85, 0.9);
            --border: rgba(148, 163, 184, 0.2);
            --border-hi: rgba(148, 163, 184, 0.4);
            --indigo: #818cf8;
            --indigo-dim: rgba(129, 140, 248, 0.2);
            --text-main: #ffffff;
            --text-dim: #f8fafc;
            --text-muted: #cbd5e1;
            --text-sub: #94a3b8;
            --cpu: #f87171;
            --ram: #c084fc;
            --temp: #fb923c;
            --bg-card: #1e293b;
            color-scheme: dark;
        }

        [data-theme="light"] {
            --bg: #f1f5f9;
            --surface: #ffffff;
            --surface-hi: #f8fafc;
            --border: rgba(99, 102, 241, 0.12);
            --border-hi: rgba(99, 102, 241, 0.3);
            --text-main: #000000;
            --text-dim: #3730a3;
            --text-muted: #334155;
            --indigo: #4338ca;
            --indigo-dim: rgba(79, 70, 229, 0.15);
            --cpu: #b91c1c;
            --ram: #7e22ce;
            --temp: #c2410c;
            color-scheme: light;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            background: var(--bg);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--text-main);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.3);
            border-radius: 4px;
        }

        #shell {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 clamp(16px, 4vw, 32px);
            height: 60px;
            border-bottom: 1px solid var(--border);
            background: var(--surface-hi);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .tb-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-box {
            width: 24px;
            height: 24px;
            background: var(--indigo);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 800;
            border-radius: 4px;
        }

        .logo-text {
            font-size: 0.95rem;
            font-weight: 800;
        }

        .tb-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-theme {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-theme:hover {
            color: var(--indigo);
            border-color: var(--indigo);
        }

        #main {
            flex: 1;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px 20px 20px;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            font-family: inherit;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 24px;
            text-decoration: none;
        }

        .btn-back:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--border-hi);
            transform: translateX(-2px);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-muted);
        }

        .monitor-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .monitor-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-main);
        }

        #marketplace-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
            margin-top: 20px;
            max-height: 540px;
            overflow-y: auto;
            padding: 12px;
            margin-right: -12px;
            margin-left: -12px;
            margin-bottom: -12px;
            scrollbar-width: thin;
            scrollbar-color: var(--indigo-dim) transparent;
        }

        #marketplace-grid::-webkit-scrollbar {
            width: 6px;
        }

        #marketplace-grid::-webkit-scrollbar-thumb {
            background: var(--indigo-dim);
            border-radius: 10px;
        }

        .market-search-bar input:focus {
            border-color: var(--indigo) !important;
            box-shadow: 0 0 0 3px var(--indigo-dim);
            background: var(--surface) !important;
        }

        .market-card {
            background: var(--surface-hi);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: all 0.3s ease;
            user-select: none;
            -webkit-user-select: none;
        }

        .market-card:hover {
            border-color: var(--indigo);
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .market-top {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .market-icon {
            font-size: 1.5rem;
            width: 42px;
            height: 42px;
            background: rgba(99, 102, 241, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            border: 1px solid rgba(99, 102, 241, 0.2);
            flex-shrink: 0;
        }

        .market-info h3 {
            font-size: 0.85rem;
            margin: 0 0 2px 0;
            color: var(--indigo);
            font-weight: 700;
        }

        .market-info p {
            font-size: 0.7rem;
            color: var(--text-dim);
            line-height: 1.3;
            margin: 0;
        }

        .market-actions {
            margin-top: auto;
            display: flex;
            gap: 10px;
        }

        .btn-install {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            border: none;
            background: var(--indigo);
            color: #fff;
            font-weight: 700;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-install:hover {
            filter: brightness(1.1);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .btn-uninstall {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid rgba(248, 113, 113, 0.3);
            background: rgba(248, 113, 113, 0.1);
            color: #f87171;
            font-weight: 700;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-uninstall:hover:not(:disabled) {
            background: rgba(248, 113, 113, 0.2);
            border-color: #f87171;
        }

        .btn-install:disabled,
        .btn-uninstall:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <div id="nv-dialog-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:100000; align-items:center; justify-content:center; backdrop-filter:blur(4px);">
        <div style="background:var(--surface-hi); padding:24px; border-radius:12px; width:90%; max-width:400px; border:1px solid var(--border); box-shadow:0 10px 40px rgba(0,0,0,0.5);">
            <h3 id="nv-dialog-title" style="margin:0 0 16px 0; color:var(--text-main); font-size:1.1rem; font-weight:800;">Confirmar acción</h3>
            <p id="nv-dialog-text" style="margin:0 0 20px 0; color:var(--text-dim); font-size:0.9rem; line-height:1.5;">¿Estás seguro?</p>
            <div style="display:flex; justify-content:flex-end; gap:12px;">
                <button id="nv-dialog-cancel" style="padding:8px 16px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--text-dim); font-weight:600; cursor:pointer; display:none;">Cancelar</button>
                <button id="nv-dialog-confirm" style="padding:8px 16px; border-radius:8px; border:none; background:var(--indigo); color:#fff; font-weight:600; cursor:pointer;">Aceptar</button>
            </div>
        </div>
    </div>
    <div id="shell">
        <div id="topbar">
            <div class="tb-left">
                <div class="logo">
                    <div class="logo-box">NV</div>
                    <span class="logo-text">Null-Void Engine</span>
                </div>
            </div>
            <div class="tb-right">
                <button class="btn-theme" id="btn-toggle-theme" title="Cambiar tema">
                    <svg id="theme-icon-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    </svg>
                </button>
            </div>
        </div>
        <div id="main">
            <div id="view-marketplace" class="view active">
                <button class="btn-back" onclick="location.href='/app'">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                    Volver
                </button>
                <div class="monitor-head">
                    <div class="monitor-title">Tienda de Aplicaciones</div>
                    <div class="badge">SISTEMA MODULAR</div>
                </div>
                <div class="market-search-bar" style="margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
                    <div style="position: relative; flex: 1; min-width: 250px;">
                        <span style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); opacity: 0.5;">🔍</span>
                        <input type="text" id="marketplace-search" placeholder="Buscar por nombre o descripción..."
                            style="width: 100%; padding: 12px 16px 12px 45px; border-radius: 12px; background: var(--surface-hi); border: 1px solid var(--border); color: var(--text-main); font-family: inherit; font-size: 0.9rem; outline: none; transition: all 0.2s;">
                    </div>
                    <select id="marketplace-filter-type" style="padding: 12px 16px; border-radius: 12px; background: var(--surface-hi); border: 1px solid var(--border); color: var(--text-main); font-family: inherit; font-size: 0.9rem; outline: none; cursor: pointer;">
                        <option value="all">Todos los tipos</option>
                        <option value="system">Sistema</option>
                        <option value="app">Aplicaciones</option>
                    </select>
                    <select id="marketplace-filter-status" style="padding: 12px 16px; border-radius: 12px; background: var(--surface-hi); border: 1px solid var(--border); color: var(--text-main); font-family: inherit; font-size: 0.9rem; outline: none; cursor: pointer;">
                        <option value="all">Cualquier estado</option>
                        <option value="installed">Instalados</option>
                        <option value="not_installed">No Instalados</option>
                    </select>
                </div>
                <div class="nav-grid" id="marketplace-grid">
                </div>
            </div>
        </div>
    </div>
    <script>
        window.TOKEN = "{{ token }}";
        window.HEADERS = { 'X-Token': window.TOKEN, 'Content-Type': 'application/json' };

        // Esperamos a que todo el árbol DOM esté construido para interactuar de forma segura
        document.addEventListener('DOMContentLoaded', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            const icon = document.getElementById('theme-icon-svg');
            const toggleBtn = document.getElementById('btn-toggle-theme');
            
            // Centralizamos el renderizado del icono SVG
            const setIcon = (theme) => {
                if (!icon) return;
                if (theme === 'light') {
                    icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
                } else {
                    icon.innerHTML = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
                }
            };

            // Aplicar el estado inicial del icono al cargar la vista
            setIcon(currentTheme);

            // Evitamos errores si el botón por alguna razón cambiara de ID o no se renderizara
            if (toggleBtn) {
                toggleBtn.addEventListener('click', () => {
                    const cur = document.documentElement.getAttribute('data-theme') || 'dark';
                    const next = cur === 'dark' ? 'light' : 'dark';
                    
                    document.documentElement.setAttribute('data-theme', __theme);
                    localStorage.setItem('theme', next);
                    setIcon(next);
                });
            }
        });
    </script>
    <script type="module" src="{{ url_for('static', filename='js/marketplace/main.js') }}"></script>

            </body>
</html>
