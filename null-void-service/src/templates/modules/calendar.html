<!DOCTYPE html>
<html lang="es" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      let __theme = localStorage.getItem('theme');
      if (!__theme) { __theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }
      document.documentElement.setAttribute('data-theme', __theme);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Null-Void Engine</title>
  <meta name="description"
    content="Aplicación de calendario personal para organizar tus tareas y eventos del día a día. Almacenamiento local, sin internet." />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/core/fonts.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/core/tokens.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/core/main.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/core/sidebar.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/modules/calendar.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/core/modal.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/core/responsive.css') }}" />
  <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
  <style>
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 600;
      font-size: 0.8rem;
      text-decoration: none;
    }

    .btn-back:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--primary);
      transform: translateX(-2px);
    }



    .type-selector {
      display: flex;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .type-btn {
      flex: 1;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      transition: all 0.2s;
      border: none;
      background: none;
    }

    .type-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 2px 8px var(--primary-glow);
    }

    [data-theme="light"] .type-selector {
      background: rgba(0, 0, 0, 0.05);
    }

    [data-theme="light"] .type-btn.active {
      color: #fff;
    }

    @media (max-width: 768px) {

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      .app-container {
        height: 100dvh;
        overflow: hidden;
      }

      .main-content {
        display: flex;
        flex-direction: column;
        height: 100dvh;
        overflow: hidden;
      }

      .view-toggle {
        display: none;
      }

      .cal-header {
        flex-shrink: 0;
        padding: 8px 4px 8px 4px !important;
        justify-content: flex-start !important;
        background: var(--bg-base) !important;
        border-bottom: none !important;
        gap: 0 !important;
        align-items: center;
      }

      .cal-nav-group {
        display: none !important;
      }

      .cal-header>div:nth-child(3) {
        display: flex;
        align-items: center;
        justify-content: flex-start !important;
        margin-left: 0;
        flex: 0 0 auto;
      }

      .cal-header>div:nth-child(3) svg {
        display: none !important;
      }

      .cal-title {
        font-size: 1.15rem !important;
        font-weight: 400 !important;
        white-space: nowrap !important;
        letter-spacing: 0 !important;
      }

      .cal-title-year {
        display: none !important;
      }

      .cal-title::after {
        content: " ▾";
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-left: 2px;
      }

      .mobile-header-actions {
        display: flex !important;
        align-items: center;
        gap: 2px;
        margin-left: auto;
      }

      .mobile-header-actions .btn-icon {
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        padding: 0;
      }

      .mobile-avatar {
        position: relative;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 600;
        font-size: 13px;
        overflow: hidden;
        margin-left: 2px;
        flex-shrink: 0;
      }

      .mobile-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
      }

      .mobile-today-btn {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .mobile-today-num {
        position: absolute;
        font-size: 7.5px;
        font-weight: 700;
        top: 52%;
        left: 50%;
        transform: translate(-50%, -15%);
        color: currentColor;
      }

      .fab-mobile {
        display: flex;
        position: fixed;
        bottom: 24px;
        right: 24px;
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background-color: var(--primary);
        color: white;
        border: none;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
        align-items: center;
        justify-content: center;
        z-index: 100;
        cursor: pointer;
        transition: transform 0.2s;
      }

      .fab-mobile:active {
        transform: scale(0.95);
      }

      .fab-mobile svg {
        width: 24px;
        height: 24px;
      }

      .cal-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-height: 0;
      }

      .month-view {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: auto !important;
        min-height: 0;
      }

      .month-weekdays {
        flex-shrink: 0;
        width: 100%;
        min-width: 0 !important;
        border-bottom: 1px solid var(--border) !important;
      }

      .month-weekday {
        font-size: 11px !important;
        font-weight: 500 !important;
        text-transform: uppercase !important;
        color: var(--text-muted) !important;
        padding: 10px 0 6px !important;
        letter-spacing: 0.5px;
      }

      .month-weekday.is-today-col {
        color: var(--primary) !important;
      }

      .month-grid {
        flex: 1;
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        grid-template-rows: none;
        grid-auto-rows: 1fr;
        width: 100%;
        min-width: 0 !important;
        min-height: 0;
        border: none !important;
        gap: 0 !important;
      }

      .month-cell {
        min-height: 0 !important;
        height: 100%;
        padding: 4px 2px !important;
        overflow: hidden;
        border: none !important;
        border-right: 1px solid var(--border) !important;
        border-bottom: 1px solid var(--border) !important;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .month-cell:nth-child(7n) {
        border-right: none !important;
      }

      .cell-day-num {
        width: 26px !important;
        height: 26px !important;
        font-size: 14px !important;
        line-height: 26px !important;
        text-align: center !important;
        margin-bottom: 4px !important;
        display: flex !important;
        align-items: center;
        justify-content: center;
        border-radius: 50% !important;
      }

      .month-cell.is-today .cell-day-num {
        background: var(--primary) !important;
        color: #fff !important;
        font-weight: 700 !important;
      }

      .month-cell.selected .cell-day-num {
        background: rgba(138, 180, 248, 0.25) !important;
        color: #8ab4f8 !important;
        border: none !important;
      }

      .month-cell.selected.is-today .cell-day-num {
        background: var(--primary) !important;
        color: #fff !important;
        border: none !important;
      }

      .event-chip {
        font-size: 9px !important;
        font-weight: 600 !important;
        padding: 3px 6px !important;
        border-radius: 6px !important;
        width: calc(100% - 4px) !important;
        text-align: left !important;
        margin-bottom: 3px !important;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        line-height: 1.3;
      }

      .event-chip-dot {
        display: none !important;
      }

      .event-time {
        display: none !important;
      }

      .week-header-row,
      .week-body {
        grid-template-columns: 22px repeat(7, 1fr) !important;
      }

      .week-day-num {
        width: 18px !important;
        height: 18px !important;
        font-size: 10px !important;
      }

      .week-day-name {
        font-size: 7.5px !important;
      }

      .time-slot-label {
        font-size: 7.5px !important;
      }

      .modal-overlay {
        padding: 0;
        background: var(--bg-surface) !important;
        align-items: flex-end;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }

      @keyframes slideUpMobile {
        from {
          opacity: 0;
          transform: translate3d(0, 100%, 0);
        }
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0);
        }
      }

      .modal {
        animation: slideUpMobile 250ms cubic-bezier(0.25, 1, 0.5, 1) both !important;
        max-height: 100dvh;
        height: 100dvh;
        width: 100vw;
        max-width: 100vw;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--bg-surface) !important;
        border: none;
        border-radius: 0;
        box-shadow: none;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        transform: translateZ(0);
        backface-visibility: hidden;
      }

      /* Detail view override */
      #event-detail-modal.modal-overlay {
        background: rgba(0, 0, 0, 0.6) !important;
        padding: 16px !important;
        align-items: center !important;
        transform: translateZ(0);
        will-change: opacity;
        animation: fadeIn 200ms ease both !important;
      }

      #event-detail-modal .modal.event-detail-view {
        height: auto !important;
        max-height: 85dvh !important;
        width: 100% !important;
        max-width: 440px !important;
        border-radius: 16px !important;
        border: 1px solid var(--border, rgba(255, 255, 255, 0.1)) !important;
        animation: scaleIn 220ms ease both !important;
        transform: translateZ(0);
        backface-visibility: hidden;
      }

      .modal-header {
        flex-shrink: 0;
        padding: 20px 24px 10px;
        background: transparent;
      }

      .modal-header h2,
      .form-label,
      .check-label {
        color: var(--text-primary) !important;
      }

      .modal-form {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 10px 24px 20px;
      }

      .modal-actions {
        flex-shrink: 0;
        background: var(--glass-bg, var(--bg-surface));
        margin: 0 -24px -22px;
        padding: 14px 24px;
        border-top: 1px solid var(--border);
        z-index: 10;
      }
    }

    @media (max-width: 480px) {
      .month-weekday {
        font-size: 8.5px !important;
      }

      .current-date {
        max-width: 110px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    }

    .fab-mobile {
      display: none;
    }

    .search-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-base);
      z-index: 200;
      flex-direction: column;
    }

    .search-overlay.active {
      display: flex;
    }

    .search-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 8px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-surface);
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 1rem;
      font-family: inherit;
      padding: 8px 4px;
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-results {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .search-result-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 16px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .search-result-item:active {
      background: rgba(255, 255, 255, 0.05);
    }

    .search-result-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 5px;
    }

    .search-result-info {
      flex: 1;
      min-width: 0;
    }

    .search-result-title {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-result-date {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .search-empty {
      text-align: center;
      color: var(--text-muted);
      padding: 40px 16px;
      font-size: 0.9rem;
    }

    .btn-menu-toggle {
      display: none;
    }

    .hamburger-icon line {
      transition: transform 0.3s ease, opacity 0.3s ease;
      transform-origin: center;
    }

    body.sidebar-locked .line-top {
      transform: translateY(6px) rotate(45deg);
    }

    body.sidebar-locked .line-middle {
      opacity: 0;
    }

    body.sidebar-locked .line-bottom {
      transform: translateY(-6px) rotate(-45deg);
    }

    /* .btn-menu-close-toggle is visible on desktop */

    @media (max-width: 1100px) {
      .sidebar-header {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .btn-menu-close-toggle {
        display: inline-flex !important;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        height: 33px;
        box-sizing: border-box;
        color: var(--text-muted);
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .btn-menu-close-toggle:hover {
        color: var(--text-main);
        background: rgba(255, 255, 255, 0.08);
        border-color: var(--primary);
      }

      .btn-menu-toggle {
        display: inline-flex !important;
        margin-right: 4px;
      }

      .view-toggle {
        display: none;
      }

      .shell {
        height: auto !important;
        overflow-y: visible !important;
      }

      .main {
        overflow-y: visible !important;
      }

      .sidebar {
        display: flex !important;
        position: fixed;
        top: 0;
        left: 0;
        height: 100dvh;
        width: 280px;
        max-width: 85vw;
        z-index: 1000;
        transform: translateX(-100%);
        transition: transform 0.28s ease;
        box-shadow: 4px 0 24px rgba(0, 0, 0, 0.45);
        flex-direction: column;
        overflow: hidden;
      }

      .sidebar-header,
      .btn-add-event,
      .mini-calendar,
      .sidebar-footer,
      .sidebar-user {
        flex-shrink: 0;
      }

      .sidebar-user {
        padding-bottom: max(16px, env(safe-area-inset-bottom));
      }

      .today-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        min-height: 0;
        overflow: hidden;
      }

      .today-tasks {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
      }

      .sidebar-footer {
        position: relative;
        background: transparent;
        z-index: 1;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 999;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.28s ease;
      }

      .sidebar-backdrop.active {
        opacity: 1;
        pointer-events: auto;
      }
    }

    @media (max-width: 1100px) and (max-height: 420px) {
      .mini-calendar {
        display: none;
      }

      .btn-add-event {
        padding: 6px 10px;
        font-size: 0.8rem;
      }
    }

    @media (max-height: 600px) {
      .cal-header {
        padding: 4px 10px !important;
        height: auto !important;
      }

      .month-cell {
        min-height: 50px !important;
      }
    }

    @media (max-height: 480px) {
      .modal-overlay {
        align-items: center;
        padding: 10px;
      }

      .modal {
        max-height: 94dvh;
        width: 100%;
        max-width: 480px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .modal-header {
        flex-shrink: 0;
        padding: 10px 18px;
      }

      #modal-title {
        font-size: 1rem;
      }

      .modal-form {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding-bottom: 60px !important;
      }

      .form-row {
        flex-wrap: wrap;
        gap: 8px;
      }

      .modal-actions {
        flex-shrink: 0;
        position: sticky;
        bottom: 0;
        background: var(--glass-bg, var(--bg-surface));
        margin: 0 -18px -14px;
        padding: 10px 18px;
        border-top: 1px solid var(--border);
        z-index: 10;
      }
    }

    body.sidebar-locked {
      overflow: hidden;
    }

    .reminders-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .reminder-chip {
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.2);
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .reminder-chip button {
      background: none;
      border: none;
      color: var(--primary);
      cursor: pointer;
      padding: 0;
      font-size: 1rem;
      line-height: 1;
      opacity: 0.6;
    }

    .reminder-chip button:hover {
      opacity: 1;
    }

    .reminder-add-row {
      margin-top: 4px;
      margin-bottom: 20px;
    }

    .sidebar-user {
      padding: 16px;
      border-top: 1px solid var(--border, rgba(255, 255, 255, 0.05));
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-name {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .user-role {
      display: block;
      font-size: 0.75rem;
      color: var(--text-sub, #a1a1aa);
      margin-top: 2px;
    }

    .user-menu-panel {
      position: absolute;
      bottom: calc(100% + 5px);
      left: 0;
      right: 0;
      margin: 0 auto;
      width: 170px;
      background: var(--bg-surface);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.1));
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      display: none;
      flex-direction: column;
      padding: 4px;
      z-index: 100;
      animation: slideUp 0.2s ease-out;
    }

    .user-menu-panel.show {
      display: flex;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .menu-item {
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .menu-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .menu-item svg {
      color: var(--text-sub, #a1a1aa);
    }

    @media (min-width: 769px) {
      .mobile-header-actions {
        display: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">

        <button class="btn-icon btn-menu-close-toggle" id="btn-menu-close-toggle" aria-label="Cerrar menú">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>

        <div class="sidebar-header-actions" style="display: flex; align-items: center; gap: 4px; margin-left: auto;">
          <button class="btn-icon" id="btn-toggle-lang" onclick="toggleLanguage()" title="Cambiar idioma"
            data-i18n-title="lang_title" aria-label="Cambiar idioma">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="2" y1="12" x2="22" y2="12"></line>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z">
              </path>
            </svg>
          </button>
          <button class="btn-icon" id="btn-toggle-theme" title="Cambiar tema" aria-label="Cambiar tema">
            <svg id="icon-theme" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5" />
              <line x1="12" y1="1" x2="12" y2="3" />
              <line x1="12" y1="21" x2="12" y2="23" />
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebar-backdrop');
      const toggleBtn = document.getElementById('btn-menu-toggle');
      const closeToggleBtn = document.getElementById('btn-menu-close-toggle');

      function openSidebar() {
        sidebar.classList.add('open');
        backdrop.classList.add('active');
        document.body.classList.add('sidebar-locked');
      }

      function closeSidebar() {
        sidebar.classList.remove('open');
        backdrop.classList.remove('active');
        document.body.classList.remove('sidebar-locked');
      }

      toggleBtn.addEventListener('click', () => {
        sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
      });

      if (closeToggleBtn) {
        closeToggleBtn.addEventListener('click', closeSidebar);
      }

      backdrop.addEventListener('click', closeSidebar);

      document.getElementById('btn-add-event')?.addEventListener('click', () => {
        if (window.innerWidth <= 1100) closeSidebar();
      });

      window.addEventListener('resize', () => {
        if (window.innerWidth > 1100) closeSidebar();
      });
    });
  </script>

        back_to_menu: "Volver al Menú"
      },
      en: {
        lang_title: "Change language", back: "Back", new_event: "New event", today: "Today",
        no_events_today: "No events today", notifs: "Notifications",
        export: "↓ Export", import: "↑ Import",
        view_month: "Month", view_week: "Week", view_day: "Day",
        modal_new: "New Event", type_event: "Event", type_task: "Task",
        event_title: "Event title", date: "Date", allday: "All day",
        completed: "Completed", important: "⭐ Important", start: "Start", end: "End",
        category: "Category", cat_personal: "Personal", cat_work: "Work",
        cat_health: "Health", cat_study: "Study", cat_leisure: "Leisure",
        desc: "Description", desc_ph: "Additional notes...",
        reminders: "Reminders", add_reminder: "+ Add reminder...",
        rem_0: "At time of event", rem_5: "5 minutes before", rem_10: "10 minutes before",
        rem_15: "15 minutes before", rem_30: "30 minutes before", rem_60: "1 hour before",
        rem_120: "2 hours before", rem_1d: "1 day before", rem_2d: "2 days before",
        rem_1w: "1 week before", rem_2w: "2 weeks before",
        btn_del: "Delete", btn_cancel: "Cancel", btn_save: "Save", btn_edit: "Edit",
        notif_title: "Notification History", clear_all: "Clear all",
        loading: "Loading history...",
        back_to_menu: "Back to Menu"
      }
    };

    window.t_cal = function (key, defaultVal) {
      if (!key) return defaultVal || key;
      const t = calTranslations[window.currentLang];
      return t && t[key] ? t[key] : (defaultVal || key);
    };

    function applyCalTranslations() {
      const t = calTranslations[window.currentLang];
      if (!t) return;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.innerHTML = t[key];
      });
      document.querySelectorAll('[data-i18n-title]').forEach(el => {
        const key = el.getAttribute('data-i18n-title');
        if (t[key]) el.title = t[key];
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (t[key]) el.placeholder = t[key];
      });

      const emptyToday = document.querySelector('.empty-today');
      if (emptyToday) emptyToday.textContent = t.no_events_today;

      const sel = document.getElementById('reminder-select');
      if (sel) {
        Array.from(sel.options).forEach(opt => {
          if (opt.value === "") opt.textContent = t.add_reminder;
          if (opt.value === "0") opt.textContent = t.rem_0;
          if (opt.value === "5") opt.textContent = t.rem_5;
          if (opt.value === "10") opt.textContent = t.rem_10;
          if (opt.value === "15") opt.textContent = t.rem_15;
          if (opt.value === "30") opt.textContent = t.rem_30;
          if (opt.value === "60") opt.textContent = t.rem_60;
          if (opt.value === "120") opt.textContent = t.rem_120;
          if (opt.value === "1440") opt.textContent = t.rem_1d;
          if (opt.value === "2880") opt.textContent = t.rem_2d;
          if (opt.value === "10080") opt.textContent = t.rem_1w;
          if (opt.value === "20160") opt.textContent = t.rem_2w;
        });
      }
    }


    function toggleLanguage() {
      window.currentLang = window.currentLang === 'es' ? 'en' : 'es';
      localStorage.setItem('lang', window.currentLang);
      applyCalTranslations();
      window.dispatchEvent(new Event('language_changed'));
    }

    document.addEventListener('DOMContentLoaded', () => {
      applyCalTranslations();
    });

    window.addEventListener('storage', function (e) {
      if (e.key === 'lang') {
        window.currentLang = e.newValue || 'es';
        applyCalTranslations();
        window.dispatchEvent(new Event('language_changed'));
      }
    });
    function toggleUserMenu(e) {
      e.stopPropagation();
      const menu = document.getElementById('user-menu');
      if (menu.classList.contains('show')) {
        menu.classList.remove('show');
      } else {
        document.querySelectorAll('.user-menu-panel').forEach(m => m.classList.remove('show'));
        menu.classList.add('show');
      }
    }

    document.addEventListener('click', (e) => {
      const userMenu = document.getElementById('user-menu');
      if (userMenu && userMenu.classList.contains('show') && !e.target.closest('#sidebar-user-btn') && !e.target.closest('#user-menu')) {
        userMenu.classList.remove('show');
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      if (window.I18n) window.I18n.init();
      document.body.classList.add('lang-loaded');
    });
  </script>

  <script>
    (function () {
      function highlightTodayWeekday() {
        const todayIndex = (new Date().getDay() + 6) % 7; // 0 = lunes … 6 = domingo
        document.querySelectorAll('.month-weekday').forEach((el, i) => {
          el.classList.toggle('is-today-col', i === todayIndex);
        });
      }
      highlightTodayWeekday();
      const body = document.getElementById('cal-body');
      if (body) new MutationObserver(highlightTodayWeekday).observe(body, { childList: true, subtree: true });
    })();
  </script>

  <script type="module" src="{{ url_for('static', filename='js/calendar/main.js') }}"></script>
