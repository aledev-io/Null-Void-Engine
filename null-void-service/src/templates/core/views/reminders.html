<div id="view-admin" class="view">
    <div style="padding: 24px; height: 100%; display: flex; flex-direction: column; overflow-y: auto;">
        <!-- Header area -->
        <div class="reminders-header-top">
            <div style="min-width: 0;">
                <h2 style="font-size: clamp(1.4rem, 6vw, 1.875rem); font-weight: 700; color: var(--text-main); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" id="reminders-page-title" data-i18n="page_title_all">Todos los Recordatorios</h2>
                <p style="font-size: 0.875rem; color: var(--text-muted); margin-top: 0.25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" data-i18n="page_subtitle">Visualiza y gestiona todos los recordatorios del sistema.</p>
            </div>
            <button onclick="window.location.href='/calendar'" style="padding: 10px 16px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: none; border-radius: 8px; color: white; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span data-i18n="new_reminder">Nuevo</span>
            </button>
        </div>
        
        <!-- Filters Area -->
        <div style="display: flex; gap: 12px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); overflow-x: auto; white-space: nowrap; scrollbar-width: none; -ms-overflow-style: none;">
            <style> #reminders-filter-pills::-webkit-scrollbar { display: none; } </style>
            <!-- Pill Filters -->
            <div id="reminders-filter-pills" style="display: flex; gap: 8px; width: max-content;">
                <div class="filter-pill active" onclick="setFilter('all', this)" style="padding: 6px 14px; font-size: 0.8rem; border-radius: 20px; cursor: pointer; background: var(--accent); color: white; border: 1px solid var(--accent); transition: all 0.2s;" data-i18n="filter_all">Todos</div>
                <div class="filter-pill" onclick="setFilter('upcoming', this)" style="padding: 6px 14px; font-size: 0.8rem; border-radius: 20px; cursor: pointer; background: transparent; color: var(--text-muted); border: 1px solid var(--border); transition: all 0.2s;" data-i18n="filter_upcoming">Próximos</div>
                <div class="filter-pill" onclick="setFilter('important', this)" style="padding: 6px 14px; font-size: 0.8rem; border-radius: 20px; cursor: pointer; background: transparent; color: var(--text-muted); border: 1px solid var(--border); transition: all 0.2s;" data-i18n="filter_important">Importantes</div>
                <div style="width: 1px; height: 24px; background: var(--border); margin: 0 8px; align-self: center;"></div>
                <div class="filter-pill" onclick="setFilter('cat-trabajo', this)" style="padding: 6px 14px; font-size: 0.8rem; border-radius: 20px; cursor: pointer; background: transparent; color: var(--text-muted); border: 1px solid var(--border); transition: all 0.2s; display: flex; align-items: center; gap: 6px;"><div style="width:8px; height:8px; border-radius:50%; background:#4bc8c8;"></div><span data-i18n="cat_trabajo">Trabajo</span></div>
                <div class="filter-pill" onclick="setFilter('cat-estudio', this)" style="padding: 6px 14px; font-size: 0.8rem; border-radius: 20px; cursor: pointer; background: transparent; color: var(--text-muted); border: 1px solid var(--border); transition: all 0.2s; display: flex; align-items: center; gap: 6px;"><div style="width:8px; height:8px; border-radius:50%; background:#f5a623;"></div><span data-i18n="cat_estudio">Estudio</span></div>
                <div class="filter-pill" onclick="setFilter('cat-salud', this)" style="padding: 6px 14px; font-size: 0.8rem; border-radius: 20px; cursor: pointer; background: transparent; color: var(--text-muted); border: 1px solid var(--border); transition: all 0.2s; display: flex; align-items: center; gap: 6px;"><div style="width:8px; height:8px; border-radius:50%; background:#6bd46b;"></div><span data-i18n="cat_salud">Salud</span></div>
                <div class="filter-pill" onclick="setFilter('cat-personal', this)" style="padding: 6px 14px; font-size: 0.8rem; border-radius: 20px; cursor: pointer; background: transparent; color: var(--text-muted); border: 1px solid var(--border); transition: all 0.2s; display: flex; align-items: center; gap: 6px;"><div style="width:8px; height:8px; border-radius:50%; background:#7c6af7;"></div><span data-i18n="cat_personal">Personal</span></div>
                <div class="filter-pill" onclick="setFilter('cat-ocio', this)" style="padding: 6px 14px; font-size: 0.8rem; border-radius: 20px; cursor: pointer; background: transparent; color: var(--text-muted); border: 1px solid var(--border); transition: all 0.2s; display: flex; align-items: center; gap: 6px;"><div style="width:8px; height:8px; border-radius:50%; background:#f97066;"></div><span data-i18n="cat_ocio">Ocio</span></div>
            </div>
        </div>

        <!-- Grid -->
        <style>
            .reminders-header-top {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                margin-bottom: 24px;
                gap: 16px;
            }
            @media (max-width: 600px) {
                .reminders-header-top {
                    flex-direction: column;
                }
            }
            
            .reminder-card {
                background: var(--bg-card);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 20px;
                display: flex;
                flex-direction: column;
                gap: 12px;
                transition: all 0.2s;
                cursor: pointer;
                position: relative;
                overflow: hidden;
            }
            .reminder-card:hover {
                border-color: var(--border-hover);
                transform: translateY(-2px);
                box-shadow: var(--shadow);
            }
            .reminder-card::before {
                content: '';
                position: absolute;
                left: 0; top: 0; bottom: 0;
                width: 4px;
                background: var(--card-color, var(--accent));
            }
            .reminder-card .reminder-title {
                font-weight: 700;
                font-size: 1.05rem;
                color: var(--text-main);
                margin: 0;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }
            .reminder-card .reminder-desc {
                font-size: 0.85rem;
                color: var(--text-muted);
                line-height: 1.4;
                display: -webkit-box;
                -webkit-line-clamp: 3;
                -webkit-box-orient: vertical;
                overflow: hidden;
                flex: 1;
            }
            .reminder-card .reminder-meta {
                display: flex;
                align-items: center;
                gap: 12px;
                margin-top: auto;
                padding-top: 12px;
                border-top: 1px solid var(--border);
                font-size: 0.8rem;
                color: var(--text-muted);
            }
            .reminder-card .tag-badge {
                font-size: 0.7rem;
                padding: 3px 8px;
                border-radius: 6px;
                font-weight: 600;
            }
            .reminder-card .reminder-header {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
            }
        </style>
        <div id="reminders-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; align-content: start;">
            <!-- Tarjetas inyectadas aquí -->
        </div>
    </div>
</div>

<script>
    window.currentFilter = 'all';

    window.t_rem = function(key) { 
        return window.t(key);
    };

    window.setFilter = function(filter, el) {
        window.currentFilter = filter;
        document.querySelectorAll('#reminders-filter-pills .filter-pill').forEach(n => {
            n.classList.remove('active');
            n.style.background = 'transparent';
            n.style.color = 'var(--text-muted)';
            n.style.borderColor = 'var(--border)';
        });
        if (el) {
            el.classList.add('active');
            el.style.background = 'var(--accent)';
            el.style.color = 'white';
            el.style.borderColor = 'var(--accent)';
        }
        
        let titleKey = 'page_title_all';
        if (filter === 'upcoming') titleKey = 'page_title_upcoming';
        if (filter === 'important') titleKey = 'page_title_important';
        if (filter.startsWith('cat-')) titleKey = filter.replace('-', '_');
        
        document.getElementById('reminders-page-title').setAttribute('data-i18n', titleKey);
        if (window.I18n) window.I18n.applyTranslations();
        
        if (window.renderReminders) window.renderReminders();
    }
    
    document.addEventListener('DOMContentLoaded', () => {
        if (window.I18n) window.I18n.applyTranslations();
    });
</script>
<script type="module" src="{{ url_for('static', filename='js/reminders/main.js') }}"></script>
