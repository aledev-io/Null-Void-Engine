<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ code }} - Null-Void Engine</title>
    <script src="{{ url_for('static', filename='js/lib/compat-legacy.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/core/fonts.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/core/main.css') }}">
    <style>
        :root {
            --bg: #07090f;
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --text-main: #fff;
            --text-sub: #94a3b8;
        }

        body {
            background: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', system-ui, sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .error-code {
            font-size: clamp(8rem, 20vw, 12rem);
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #fff 0%, #6366f1 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px var(--primary-glow));
            margin: 0;
            letter-spacing: -0.05em;
        }

        .error-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: -1rem;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        .error-desc {
            color: var(--text-sub);
            max-width: 400px;
            margin: 20px auto 30px;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 28px;
            background: var(--primary);
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            box-shadow: 0 10px 25px -5px var(--primary-glow);
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px var(--primary-glow);
            filter: brightness(1.1);
        }

        .glow-sphere {
            position: absolute;
            width: 40vw;
            height: 40vw;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            opacity: 0.3;
        }

        .glow-1 {
            top: -10%;
            left: -10%;
        }

        .glow-2 {
            bottom: -10%;
            right: -10%;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }

            50% {
                opacity: 0.5;
                transform: scale(1.1);
            }
        }

        .glow-sphere {
            animation: pulse 8s infinite ease-in-out;
        }
    </style>
    <!-- Compat Legacy: overrides al final para máxima especificidad -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/core/compat-legacy.css') }}">
</head>

<body>
    <div class="glow-sphere glow-1"></div>
    <div class="glow-sphere glow-2"></div>

    <div class="container">
        <h1 class="error-code">{{ code }}</h1>
        <h2 class="error-title">{{ title }}</h2>
        <p class="error-desc">{{ message }}</p>
        <a href="/" class="btn-home">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            Volver al inicio
        </a>
    </div>

            </body>
</html>
