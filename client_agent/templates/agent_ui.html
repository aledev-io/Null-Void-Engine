<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Null-Void Cloud Sync — {{ DEVICE_NAME }}</title>
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #111827;
      --surface-2: #1e293b;
      --border: #1f2937;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --text-faint: #64748b;
      --indigo: #6366f1;
      --indigo-hover: #4f46e5;
      --violet: #818cf8;
      --emerald: #10b981;
      --amber: #f59e0b;
      --rose: #ef4444;
      --console-bg: #030712;
      --console-fg: #34d399;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; user-select: none; }
    
    /* Header */
    .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-svg { width: 26px; height: 26px; stroke: var(--violet); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .brand-title { font-weight: 700; font-size: 14px; color: var(--text); }
    .brand-sub { font-size: 11px; color: var(--text-dim); }
    
    .status-pill { display: flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 9999px; background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.25); font-size: 12px; font-weight: 600; color: var(--emerald); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--emerald); box-shadow: 0 0 8px var(--emerald); }
    .status-pill.connecting { background: rgba(245,158,11,0.1); border-color: rgba(245,158,11,0.25); color: var(--amber); }
    .status-pill.connecting .status-dot { background: var(--amber); box-shadow: 0 0 8px var(--amber); }

    /* Tab Bar */
    .tab-bar { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 14px; gap: 4px; }
    .tab-btn { background: transparent; border: none; color: var(--text-dim); padding: 10px 14px; font-size: 12px; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; display: flex; align-items: center; gap: 6px; transition: all 0.15s ease; }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--violet); border-bottom-color: var(--indigo); }

    /* Body Views */
    .view { flex: 1; display: none; flex-direction: column; padding: 16px; gap: 14px; overflow-y: auto; }
    .view.active { display: flex; }
    .view-iframe { padding: 0; overflow: hidden; }

    /* Cards */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .card-label { font-size: 10px; font-weight: 700; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    
    .info-row { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; }
    .info-lbl { color: var(--text-dim); }
    .info-val { font-weight: 600; color: var(--text); word-break: break-all; }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: center; }
    .stat-num { font-size: 18px; font-weight: 700; color: var(--text); }
    .stat-lbl { font-size: 9px; font-weight: 700; color: var(--text-faint); text-transform: uppercase; margin-top: 2px; }

    /* Buttons */
    .btn-row { display: flex; gap: 8px; }
    .btn { flex: 1; padding: 9px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-weight: 600; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.15s ease; }
    .btn:hover { background: #334155; }
    .btn-primary { background: var(--indigo); border-color: var(--indigo); color: #fff; }
    .btn-primary:hover { background: var(--indigo-hover); }

    /* Console */
    .console-wrap { flex: 1; display: flex; flex-direction: column; background: var(--console-bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .console-toolbar { background: var(--surface); padding: 6px 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); font-size: 11px; color: var(--text-dim); }
    .console-log { flex: 1; padding: 12px; font-family: "Consolas", "Fira Code", monospace; font-size: 11px; line-height: 1.5; color: var(--console-fg); overflow-y: auto; white-space: pre-wrap; word-break: break-word; }

    iframe { width: 100%; height: 100%; border: none; background: var(--bg); }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="brand">
      <svg class="brand-svg" viewBox="0 0 24 24">
        <path d="M17.5 19C19.9853 19 22 16.9853 22 14.5C22 12.1564 20.2064 10.2314 17.9004 10.0242C17.4339 6.57723 14.4756 4 10.9 4C7.03401 4 3.9 7.13401 3.9 11C3.9 11.2372 3.91176 11.4716 3.93467 11.7027C2.2618 12.3059 1 13.9048 1 15.8C1 18.1196 2.88041 20 5.2 20H17.5Z"/>
      </svg>
      <div>
        <div class="brand-title">Null-Void Cloud</div>
        <div class="brand-sub">Agente de Escritorio — {{ DEVICE_NAME }}</div>
      </div>
    </div>
    <div id="statusBadge" class="status-pill connecting">
      <span class="status-dot"></span>
      <span id="statusText">Conectando…</span>
    </div>
  </header>

  <!-- Tab Nav -->
  <nav class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('tab-dash', this)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
      Estado y Control
    </button>
    <button class="tab-btn" onclick="switchTab('tab-cloud', this)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"/></svg>
      Nube Integrada
    </button>
    <button class="tab-btn" onclick="switchTab('tab-logs', this)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
      Consola de Actividad
    </button>
  </nav>

  <!-- View 1: Dashboard -->
  <main id="tab-dash" class="view active">
    <div class="card">
      <div class="card-label">Información de Conexión</div>
      <div class="info-row"><span class="info-lbl">Dispositivo</span><span class="info-val">{{ DEVICE_NAME }}</span></div>
      <div class="info-row"><span class="info-lbl">Carpeta Local</span><span class="info-val">{{ LOCAL_DIR }}</span></div>
      <div class="info-row"><span class="info-lbl">Servidor</span><span id="serverUrl" class="info-val">{{ ACTIVE_URL }}</span></div>
      <div class="info-row"><span class="info-lbl">Última Sincronización</span><span id="lastSync" class="info-val">—</span></div>
    </div>

    <div class="stats-grid">
      <div class="stat-box"><div id="statUp" class="stat-num">0</div><div class="stat-lbl">Subidos</div></div>
      <div class="stat-box"><div id="statDown" class="stat-num">0</div><div class="stat-lbl">Descargados</div></div>
      <div class="stat-box"><div id="statDel" class="stat-num">0</div><div class="stat-lbl">Borrados</div></div>
      <div class="stat-box"><div id="statPending" class="stat-num">0</div><div class="stat-lbl">En Cola</div></div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" onclick="fetch('/api/open-folder', {method:'POST'})">Abrir Carpeta Local</button>
      <button class="btn" onclick="fetch('/api/sync-now', {method:'POST'})">Sincronizar Ahora</button>
      <button class="btn" onclick="switchTab('tab-cloud', document.querySelectorAll('.tab-btn')[1])">Nube Web Integrada</button>
    </div>

    <div class="console-wrap" style="height: 180px;">
      <div class="console-toolbar">
        <span>ACTIVIDAD EN TIEMPO REAL</span>
        <button class="btn" style="padding:2px 8px; font-size:10px;" onclick="clearLogs()">Limpiar</button>
      </div>
      <div id="miniLog" class="console-log"></div>
    </div>
  </main>

  <!-- View 2: Embedded Cloud -->
  <main id="tab-cloud" class="view view-iframe">
    <iframe id="cloudFrame" src="{{ CLOUD_IFRAME_URL }}"></iframe>
  </main>

  <!-- View 3: Activity Logs -->
  <main id="tab-logs" class="view">
    <div class="console-wrap">
      <div class="console-toolbar">
        <span>REGISTRO DE SINCRONIZACIÓN</span>
        <div>
          <label><input type="checkbox" id="autoScroll" checked> Auto-scroll</label>
          <button class="btn" style="display:inline-block; padding:2px 8px; font-size:10px; margin-left:8px;" onclick="clearLogs()">Limpiar Consola</button>
        </div>
      </div>
      <div id="fullLog" class="console-log"></div>
    </div>
  </main>

  <script>
    function switchTab(tabId, btn) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    function clearLogs() {
      document.getElementById('miniLog').innerText = '';
      document.getElementById('fullLog').innerText = '';
    }

    function pollStatus() {
      fetch('/api/status')
        .then(r => r.json())
        .then(d => {
          const badge = document.getElementById('statusBadge');
          const txt = document.getElementById('statusText');
          if (d.latest_version) {
            badge.className = 'status-pill connecting';
            txt.innerText = 'Actualización v' + d.latest_version;
          } else if (d.connected) {
            badge.className = 'status-pill';
            txt.innerText = 'Conectado';
          } else {
            badge.className = 'status-pill connecting';
            txt.innerText = 'Reconectando…';
          }

          document.getElementById('serverUrl').innerText = d.server_url || '—';
          document.getElementById('lastSync').innerText = d.last_sync || '—';
          document.getElementById('statUp').innerText = d.stats.uploaded;
          document.getElementById('statDown').innerText = d.stats.downloaded;
          document.getElementById('statDel').innerText = d.stats.deleted;
          document.getElementById('statPending').innerText = d.stats.pending;
          
          if (d.server_url) {
            const frame = document.getElementById('cloudFrame');
            if (frame.src === 'about:blank') {
              frame.src = d.server_url + '/cloud?view=computers';
            }
          }
        }).catch(() => {});
    }

    function pollLogs() {
      fetch('/api/logs')
        .then(r => r.json())
        .then(d => {
          if (d.logs && d.logs.length > 0) {
            const mini = document.getElementById('miniLog');
            const full = document.getElementById('fullLog');
            d.logs.forEach(msg => {
              mini.innerText += msg + '\n';
              full.innerText += msg + '\n';
            });
            if (document.getElementById('autoScroll').checked) {
              mini.scrollTop = mini.scrollHeight;
              full.scrollTop = full.scrollHeight;
            }
          }
        }).catch(() => {});
    }

    setInterval(pollStatus, 1000);
    setInterval(pollLogs, 300);
    pollStatus();
    pollLogs();
  </script>
</body>
</html>
