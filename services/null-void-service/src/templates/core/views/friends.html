<style id="fr-styles">
    #view-friends {
        background: var(--bg, #0f0f13);
        --bg: var(--bg-primary);
        --surface: var(--bg-card);
        --surface-hi: var(--surface-hi);
        --surface-2: var(--bg-secondary);
        --border: var(--border, rgba(255, 255, 255, 0.08));
        --text-main: var(--text-main);
        --text-dim: var(--text-muted);
        --indigo: var(--accent);
        --indigo-dim: var(--accent-2);

        --bg-tabs: rgba(128, 128, 128, 0.1);
        --shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.12);
        color: var(--text-main);
    }

        .fr-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;
            overflow: hidden;
            background: var(--surface);
            border-radius: 12px;
            border: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .fr-panel-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: transparent;
        }

        .fr-panel-header {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            padding: 16px 24px;
            border-bottom: none;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px 12px 0 0;
        }

        .fr-panel-header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .fr-panel-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .fr-panel-title {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .fr-panel-subtitle {
            margin: 4px 0 0 0;
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .fr-panel-header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: auto;
        }

        .fr-scroll {
            flex: 1;
            overflow-y: auto;
        }

        .fr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 350px), 1fr));
            gap: 16px;
            padding: 24px;
        }

        .fr-tab-container {
            display: flex;
            background: var(--bg-tabs);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border);
            overflow-x: auto;
            max-width: 100%;
            flex-shrink: 0;
            white-space: nowrap;
        }
        
        .fr-tab-container::-webkit-scrollbar {
            display: none;
        }

        @media (max-width: 600px) {
            .fr-panel-header {
                flex-direction: column;
                align-items: stretch;
                padding: 12px;
                gap: 12px;
            }
            .fr-panel-header-right {
                width: 100%;
                margin-left: 0;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .fr-tab-container {
                width: 100%;
                display: flex;
                background: var(--bg-tabs);
                padding: 3px;
                border-radius: 10px;
                border: 1px solid var(--border);
                box-sizing: border-box;
                gap: 2px;
            }
            .fr-tab-btn {
                flex: 1;
                min-width: 0;
                text-align: center;
                padding: 7px 3px;
                font-size: 0.72rem;
                font-weight: 700;
                white-space: nowrap;
                border-radius: 8px;
            }
            .fr-panel-header-right .fr-btn-action {
                width: 100%;
                padding: 10px 14px;
                font-size: 0.82rem;
                font-weight: 600;
                border-radius: 10px;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
            }
            .fr-panel-header-right .fr-btn-action .fr-btn-text {
                display: inline;
            }
            .fr-grid {
                padding: 16px;
                grid-template-columns: 1fr;
            }
        }

        .fr-panel-footer {
            padding: 12px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-dim);
            font-size: 0.78rem;
            background: var(--surface-2);
        }

        .fr-event-row {
            display: flex;
            align-items: center;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .fr-event-row:hover {
            border-color: var(--indigo);
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .fr-event-indicator {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--text-dim);
        }

        .fr-event-body {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 0;
        }

        .fr-event-meta {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .fr-event-badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .fr-event-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .fr-event-desc {
            font-size: 0.8rem;
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .fr-tab-btn {
            padding: 6px 14px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text-dim);
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            justify-content: center;
        }

        .fr-tab-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.04);
        }

        [data-theme="light"] .fr-tab-btn:hover {
            background: rgba(0, 0, 0, 0.03);
        }

        .fr-tab-btn.active {
            background: var(--indigo);
            color: #ffffff !important;
        }

        .fr-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--indigo), #8b5cf6);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.95rem;
            flex-shrink: 0;
            position: relative;
        }

        .fr-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .fr-online-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #10b981;
            border: 2px solid var(--surface);
            z-index: 2;
        }

        [data-theme="light"] .fr-online-dot {
            border-color: #ffffff;
        }

        .fr-offline-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #64748b;
            border: 2px solid var(--surface);
            z-index: 2;
        }

        [data-theme="light"] .fr-offline-dot {
            border-color: #ffffff;
        }

        .fr-btn-chat {
            background: rgba(99, 102, 241, 0.1);
            color: #818cf8;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .fr-btn-chat:hover {
            background: var(--indigo);
            color: white;
            transform: scale(1.05);
        }

        .fr-btn-action {
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .fr-btn-action.accept {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
        }

        .fr-btn-action.accept:hover {
            background: #10b981;
            color: white;
        }

        .fr-btn-action.reject {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }

        .fr-btn-action.reject:hover {
            background: #ef4444;
            color: white;
        }

        .fr-dialog-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 99999;
            align-items: center;
            justify-content: center;
        }

        .fr-dialog-overlay.active {
            display: flex;
        }

        .fr-dialog {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            animation: chatScaleIn 0.25s ease-out;
        }

        .fr-dialog-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .fr-dialog-header h3 {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .fr-dialog-close {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
            transition: color 0.2s;
        }

        .fr-dialog-close:hover {
            color: var(--text-main);
        }

        .fr-dialog-body {
            padding: 16px 20px;
        }

        .fr-dialog-input {
            width: 100%;
            box-sizing: border-box;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 11px 14px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .fr-dialog-input:focus {
            border-color: var(--indigo);
        }

        .fr-search-results {
            max-height: 280px;
            overflow-y: auto;
        }

        .fr-result-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            transition: background 0.1s;
        }

        .fr-result-item:hover {
            background: rgba(99, 102, 241, 0.05);
        }

        .fr-status-tag {
            font-size: 0.72rem;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 6px;
        }

        .fr-status-friends {
            background: rgba(52, 211, 153, 0.1);
            color: #34d399;
        }

        .fr-status-pending {
            background: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
        }
</style>
<div id="view-friends" class="view"
    style="padding:10px; margin:0; width:100%; height:100%; box-sizing:border-box; flex-direction:column; overflow:hidden;">
</div>
<script type="module" src="{{ url_for('static', filename='js/friends/main.js') }}"></script>
