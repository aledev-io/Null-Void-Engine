<div id="view-server_admin" class="view">
    <div class="view-header" style="display: flex; align-items: center; gap: 20px; margin-bottom: 30px;">
        <button class="app-back-header" onclick="showView('menu')" title="Volver" data-i18n-title="back" aria-label="Volver">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            <span class="app-back-header-title" data-i18n="server_admin_title">Administración del Servidor</span>
        </button>
    </div>
    <div class="config-grid"
        style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; max-width: 1000px;">
        <div class="profile-card"
            style="padding: 24px; background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border); display: flex; flex-direction: column; max-height: 400px; grid-column: 1 / -1;">
            <h3 data-i18n="server_admin_quotas"
                style="font-size: 1.1rem; margin-bottom: 20px; color: var(--text-main); flex-shrink: 0;">
                Peticiones de Cuota (Cloud)</h3>
            <div id="dashboard-admin-quota-list"
                style="min-height: 100px; overflow-y: auto; padding-right: 8px;">
                <!-- JS fills this -->
            </div>
        </div>

        <div class="profile-card"
            style="padding: 24px; background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border); grid-column: 1 / -1; display: flex; flex-direction: column; max-height: 500px;">
            <h3 data-i18n="server_admin_users"
                style="font-size: 1.1rem; margin-bottom: 20px; color: var(--text-main); flex-shrink: 0;">Gestión
                de Usuarios</h3>
            <div id="dashboard-admin-users-list"
                style="display: grid; gap: 12px; overflow-y: auto; padding-right: 8px;">
                <!-- JS fills this -->
            </div>
        </div>
    </div>
</div>
<div id="view-admin_user_edit" class="view">
    <div class="view-header" style="display: flex; align-items: center; gap: 20px; margin-bottom: 30px;">
        <button class="app-back-header" onclick="showView('server_admin')" title="Volver" data-i18n-title="back" aria-label="Volver">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            <span class="app-back-header-title" data-i18n="admin_edit_user_title">Editar Usuario</span><span id="admin-edit-username"
                style="color: var(--accent);"></span>
        </button>
    </div>
    <div class="config-grid"
        style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; max-width: 600px;">
        <div class="profile-card"
            style="padding: 24px; background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border);">
            <div style="display: flex; flex-direction: column; gap: 16px;">
                <div>
                    <label style="display: block; font-size: 0.85rem; opacity: 0.7; margin-bottom: 8px;"
                        data-i18n="admin_edit_quota">Cuota Máxima (GB)</label>
                    <div style="display: flex; gap: 12px;">
                        <input type="number" id="admin-edit-quota-input" min="0"
                            style="flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-main); color: var(--text-main); font-size: 1rem;">
                        <button onclick="saveDashboardUserQuota()"
                            style="padding: 0 24px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;"
                            data-i18n="save_changes">Guardar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
